[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iptc"
version = "0.2.0"
description = "Interaction-Preserving Compression of Multi-Agent Trajectory Databases"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]
native = ["pyarrow>=16"]

[project.scripts]
iptc = "iptc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
