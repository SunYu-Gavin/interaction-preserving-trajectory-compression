name: Tests
on: [push, pull_request]
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m iptc.cli import --input examples/synthetic.csv --output runs/raw.npz --ticks-per-second 10
      - run: python -m iptc.benchmark --config configs/demo.yaml
