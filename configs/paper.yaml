# Import the user-held inputs first; see docs/REPRODUCE.md.
inputs:
  - data/rec0_raw.npz
  - data/rec1_raw.npz
  - data/rec2_raw.npz
  - data/rec3_raw.npz
  - data/rec4_raw.npz
  - data/rec5_raw.npz
  - data/rec6_raw.npz
  - data/rec7_raw.npz
  - data/rec8_raw.npz
  - data/rec9_raw.npz
  - data/rec10_raw.npz
